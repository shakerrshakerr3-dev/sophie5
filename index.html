      "وكالات إعلان الإنترنت",
      "وكالة تخطيط وسائل الإعلان (Media-Planning Agency)",
      "وكالة الإعلانات الطبية",
      "وكالة إعلانات الأطفال"
    ],
    answer: 1,
    explanation: "وكالة Zenith مثال على وكالة تخطيط وسائل الإعلان تابعة لـ Saatchi and Saatchi تمتلك 66 فرعاً في 39 دولة."
  },
  {
    id: 57,
    chapter: "الفصل الثاني: الوكالة الإعلانية",
    question: "تتمتع وكالات الإعلانات الخارجية (Outdoor Agency) بحقوق امتياز الإعلان على:",
    options: [
      "الطرق السريعة وأسطح العمارات وجدران العقارات وأعمدة الإنارة والملاعب",
      "الصفحات الأولى من الصحف والمجلات الرسمية",
      "القنوات التلفزيونية الفضائية والتطبيقات التفاعلية",
      "محطات الإذاعة المحلية والشبكية"
    ],
    answer: 0,
    explanation: "لهذه الوكالات حقوق امتياز الإعلان على الطرق السريعة وأسطح العمارات والجدران وأعمدة الإنارة وملاعب كرة القدم."
  },
  {
    id: 58,
    chapter: "الفصل الثاني: الوكالة الإعلانية",
    question: "من أمثلة الوكالات المتخصصة في إعلان الإنترنت والتفاعلي والمذكورة في المنهج:",
    options: [
      "وكالة دايمنشن (Dimension) ووكالة Organic Online",
      "وكالة Zenith ووكالة Grace",
      "وكالة شريف صبري للإعلان",
      "وكالة بركة للإعلان"
    ],
    answer: 0,
    explanation: "من أمثلة الوكالات التفاعلية المتخصصة في الإنترنت: وكالة دايمنشن ووكالة Organic Online."
  },
  {
    id: 59,
    chapter: "الفصل الثاني: الوكالة الإعلانية",
    question: "تتقاضى الوكالات المتخصصة في إعلان السلع الصناعية (Industrial Agency) أجراً شهرياً أو سنوياً لأن:",
    options: [
      "المنشورات والكتالوجات ذات أسعار إعلانية منخفضة لا تعطي عمولة كبيرة للوكالة",
      "القوانين تمنع حصولها على عمولات",
      "عملها مقتصر على تقديم الاستشارات الشفهية",
      "جمهورها يقتصر على الأطفال فقط"
    ],
    answer: 0,
    explanation: "الرسائل والكتالوجات الصناعية ذات أسعار إعلانية منخفضة لا تعطي عمولة كبيرة، لذا تتقاضى أجراً شهرياً أو سنوياً لتعويض العمولات."
  },
  {
    id: 60,
    chapter: "الفصل الثاني: الوكالة الإعلانية",
    question: "وكالة (Saatchi & Saatchi Health Care) التي يعمل بها 79 طبيباً وصيدلياً تُعد مثالاً على:",
    options: [
      "وكالات منتجات الأطفال",
      "الوكالات الطبية والمتخصصة في منتجات العناية بالصحة والأدوية",
      "وكالات تجار التجزئة والجملة",
      "وكالات الأقليات"
    ],
    answer: 1,
    explanation: "هي مثال للوكالات الطبية المتخصصة، حيث تضم 79 طبيباً وصيدلياً يشاركون باستشاراتهم العلمية."
  }
];

function App() {
  const [gameState, setGameState] = useState('welcome'); // welcome, quiz, summary
  const [currentIdx, setCurrentIdx] = useState(0);
  const [selectedOpt, setSelectedOpt] = useState(null);
  const [userAnswers, setUserAnswers] = useState(Array(quizQuestions.length).fill(null));
  const [filterChapter, setFilterChapter] = useState('all');

  const activeQuestions = filterChapter === 'all'
    ? quizQuestions
    : quizQuestions.filter(q => filterChapter === 'ch1' ? q.id <= 30 : q.id > 30);

  const currentQ = activeQuestions[currentIdx] || quizQuestions[0];

  const handleSelectOption = (index) => {
    if (selectedOpt !== null) return;
    setSelectedOpt(index);
    const updated = [...userAnswers];
    updated[currentQ.id - 1] = index;
    setUserAnswers(updated);
  };

  const handleNext = () => {
    if (currentIdx < activeQuestions.length - 1) {
      setCurrentIdx(currentIdx + 1);
      setSelectedOpt(userAnswers[activeQuestions[currentIdx + 1].id - 1]);
    } else {
      setGameState('summary');
    }
  };

  const handlePrev = () => {
    if (currentIdx > 0) {
      setCurrentIdx(currentIdx - 1);
      setSelectedOpt(userAnswers[activeQuestions[currentIdx - 1].id - 1]);
    }
  };

  const calculateScore = () => {
    let score = 0;
    quizQuestions.forEach((q) => {
      if (userAnswers[q.id - 1] === q.answer) {
        score++;
      }
    });
    return score;
  };

  const resetQuiz = () => {
    setUserAnswers(Array(quizQuestions.length).fill(null));
    setCurrentIdx(0);
    setSelectedOpt(null);
    setGameState('welcome');
  };

  const startQuiz = (chapter) => {
    setFilterChapter(chapter);
    setCurrentIdx(0);
    setSelectedOpt(null);
    setGameState('quiz');
  };

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100 font-sans p-4 md:p-8 flex flex-col items-center justify-center dir-rtl" dir="rtl">

      {/* Header Banner */}
      <header className="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 mb-6 shadow-xl text-center">
        <h1 className="text-2xl md:text-4xl font-extrabold text-amber-400 mb-2">
          اختبار تفاعلي شامل: إدارة الإعلان والوكالات الإعلانية
        </h1>
        <p className="text-slate-400 text-sm md:text-base">
          تطبيق تفاعلي يغطي 60 سؤالاً اختيار من متعدد للمادة العلمية (الفصل الأول والفصل الثاني)
        </p>
      </header>

      {/* Welcome Screen */}
      {gameState === 'welcome' && (
        <main className="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-10 shadow-2xl text-center space-y-6">
          <div className="p-4 bg-amber-500/10 border border-amber-500/30 rounded-xl text-amber-300 text-sm md:text-base leading-relaxed">
            مرحباً بك! هذا الاختبار التفاعلي مصمم لقياس مدى استيعابك للمصادر المرفقة (مفهوم المعلن والتنظيم الداخلي لإدارة الإعلان، وأنواع الوكالات الإعلانية ونشاطها).
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 my-6">
            <div className="bg-slate-700/50 border border-slate-600 p-5 rounded-xl text-right flex flex-col justify-between">
              <div>
                <span className="bg-amber-500/20 text-amber-300 text-xs px-2.5 py-1 rounded-full font-bold">30 سؤالاً</span>
                <h3 className="text-lg font-bold mt-3 text-slate-200">الفصل الأول فقط</h3>
                <p className="text-xs text-slate-400 mt-1">المعلن، التنظيم الداخلي (مركزي/لامركزي)، والوظائف.</p>
              </div>
              <button
                onClick={() => startQuiz('ch1')}
                className="mt-4 w-full bg-slate-600 hover:bg-amber-600 text-white font-bold py-2 px-4 rounded-lg transition text-sm">
                بدء الفصل الأول
              </button>
            </div>

            <div className="bg-slate-700/50 border border-slate-600 p-5 rounded-xl text-right flex flex-col justify-between">
              <div>
                <span className="bg-blue-500/20 text-blue-300 text-xs px-2.5 py-1 rounded-full font-bold">30 سؤالاً</span>
                <h3 className="text-lg font-bold mt-3 text-slate-200">الفصل الثاني فقط</h3>
                <p className="text-xs text-slate-400 mt-1">نشأة الوكالة، أهميتها، الشروط، وتصنيف الوكالات.</p>
              </div>
              <button
                onClick={() => startQuiz('ch2')}
                className="mt-4 w-full bg-slate-600 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition text-sm">
                بدء الفصل الثاني
              </button>
            </div>

            <div className="bg-gradient-to-br from-amber-950/40 to-slate-800 border border-amber-500/50 p-5 rounded-xl text-right flex flex-col justify-between">
              <div>
                <span className="bg-amber-400 text-slate-950 text-xs px-2.5 py-1 rounded-full font-bold">60 سؤالاً</span>
                <h3 className="text-lg font-bold mt-3 text-amber-300">الاختبار الشامل الكامل</h3>
                <p className="text-xs text-slate-300 mt-1">شامل لكافة تفاصيل المنهج بالكامل في اختبار واحد.</p>
              </div>
              <button
                onClick={() => startQuiz('all')}
                className="mt-4 w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold py-2 px-4 rounded-lg transition text-sm shadow-lg">
                بدء الاختبار الشامل
              </button>
            </div>
          </div>
        </main>
      )}

      {/* Quiz Screen */}
      {gameState === 'quiz' && (
        <main className="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-8 shadow-2xl flex flex-col space-y-6">

          <div className="flex flex-col md:flex-row justify-between items-center gap-4 pb-4 border-b border-slate-700">
            <span className="text-xs md:text-sm font-semibold bg-slate-700 px-3 py-1.5 rounded-lg text-amber-300">
              {currentQ.chapter}
            </span>
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-400">السؤال:</span>
              <span className="text-lg font-bold text-amber-400">{currentIdx + 1}</span>
              <span className="text-xs text-slate-400">من {activeQuestions.length}</span>
            </div>
          </div>

          <div className="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
            <div
              className="bg-amber-400 h-full transition-all duration-300"
              style={{ width: `${((currentIdx + 1) / activeQuestions.length) * 100}%` }}>
            </div>
          </div>

          <div className="my-2">
            <h2 className="text-lg md:text-xl font-bold leading-snug text-slate-100">
              {currentQ.question}
            </h2>
          </div>

          <div className="grid grid-cols-1 gap-3">
            {currentQ.options.map((opt, idx) => {
              const isSelected = selectedOpt === idx;
              const isCorrect = idx === currentQ.answer;
              const hasAnswered = selectedOpt !== null;

              let btnStyle = "border-slate-700 bg-slate-900/60 hover:bg-slate-700/60 text-slate-200";

              if (hasAnswered) {
                if (isCorrect) {
                  btnStyle = "border-emerald-500 bg-emerald-950/40 text-emerald-200 font-bold";
                } else if (isSelected && !isCorrect) {
                  btnStyle = "border-rose-500 bg-rose-950/40 text-rose-200 font-bold";
                } else {
                  btnStyle = "border-slate-800 bg-slate-900/30 text-slate-500 opacity-60";
                }
              }

              return (
                <button
                  key={idx}
                  onClick={() => handleSelectOption(idx)}
                  disabled={hasAnswered}
                  className={`w-full text-right p-4 rounded-xl border text-sm md:text-base transition-all flex items-start gap-3 ${btnStyle}`}
                >
                  <span className={`w-6 h-6 rounded-full flex items-center justify-center shrink-0 text-xs ${
                    hasAnswered && isCorrect ? 'bg-emerald-500 text-slate-950 font-bold' :
                    hasAnswered && isSelected && !isCorrect ? 'bg-rose-500 text-white font-bold' : 'bg-slate-700 text-slate-300'
                  }`}>
                    {idx === 0 ? 'أ' : idx === 1 ? 'ب' : idx === 2 ? 'ج' : 'د'}
                  </span>
                  <span className="flex-1">{opt}</span>
                </button>
              );
            })}
          </div>

          {selectedOpt !== null && (
            <div className={`p-4 rounded-xl border text-sm leading-relaxed transition-all ${
              selectedOpt === currentQ.answer
                ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300'
                : 'bg-amber-950/30 border-amber-500/40 text-amber-200'
            }`}>
              <div className="font-bold mb-1 flex items-center gap-2">
                <span>{selectedOpt === currentQ.answer ? 'إجابة صحيحة ✓' : 'إجابة غير صحيحة ✗ (الشرح والتوضيح)'}</span>
              </div>
              <p className="text-xs md:text-sm text-slate-300">{currentQ.explanation}</p>
            </div>
          )}

          <div className="flex justify-between items-center pt-4 border-t border-slate-700">
            <button
              onClick={handlePrev}
              disabled={currentIdx === 0}
              className={`px-5 py-2.5 rounded-xl border font-semibold text-sm transition ${
                currentIdx === 0
                  ? 'border-slate-800 text-slate-600 cursor-not-allowed'
                  : 'border-slate-600 text-slate-300 hover:bg-slate-700'
              }`}
            >
              السابق
            </button>

            <button
              onClick={handleNext}
              disabled={selectedOpt === null}
              className={`px-6 py-2.5 rounded-xl font-bold text-sm transition ${
                selectedOpt === null
                  ? 'bg-slate-700 text-slate-500 cursor-not-allowed'
                  : 'bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-lg'
              }`}
            >
              {currentIdx === activeQuestions.length - 1 ? 'عرض النتيجة النهائية' : 'التالي'}
            </button>
          </div>
        </main>
      )}

      {/* Summary Screen */}
      {gameState === 'summary' && (
        <main className="w-full max-w-4xl bg-slate-800 border border-slate-700 rounded-2xl p-6 md:p-10 shadow-2xl text-center space-y-6">
          <div className="space-y-2">
            <h2 className="text-2xl md:text-3xl font-extrabold text-amber-400">
              ملخص نتيجة الاختبار التفاعلي
            </h2>
            <p className="text-slate-400 text-sm">تم الانتهاء من الإجابة على الأسئلة بنجاح</p>
          </div>

          <div className="bg-slate-900/80 border border-slate-700 p-6 rounded-2xl max-w-md mx-auto space-y-3">
            <div className="text-4xl md:text-6xl font-black text-amber-400">
              {calculateScore()} <span className="text-lg text-slate-400 font-normal">/ {quizQuestions.length}</span>
            </div>
            <p className="text-sm text-slate-300">
              نسبة النجاح: <span className="font-bold text-emerald-400">{Math.round((calculateScore() / quizQuestions.length) * 100)}%</span>
            </p>
          </div>

          <div className="text-right space-y-3 max-h-96 overflow-y-auto p-2 border border-slate-700 rounded-xl bg-slate-900/40">
            <h3 className="font-bold text-slate-200 sticky top-0 bg-slate-800 p-2 border-b border-slate-700">مراجعة الإجابات:</h3>
            {quizQuestions.map((q, i) => {
              const uAns = userAnswers[q.id - 1];
              const isCorr = uAns === q.answer;
              return (
                <div key={q.id} className={`p-3 rounded-lg border text-xs md:text-sm ${isCorr ? 'border-emerald-900/50 bg-emerald-950/20' : 'border-rose-900/50 bg-rose-950/20'}`}>
                  <div className="font-bold text-slate-200 mb-1">
                    {q.id}. {q.question}
                  </div>
                  <div className="flex flex-col gap-1 text-slate-400">
                    <span>إجابتك: <strong className={isCorr ? 'text-emerald-400' : 'text-rose-400'}>{uAns !== null ? q.options[uAns] : 'لم يتم الإجابة'}</strong></span>
                    {!isCorr && <span>الإجابة الصحيحة: <strong className="text-emerald-400">{q.options[q.answer]}</strong></span>}
                  </div>
                </div>
              );
            })}
          </div>

          <button
            onClick={resetQuiz}
            className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold px-8 py-3 rounded-xl transition shadow-lg text-base"
          >
            إعادة الاختبار من جديد
          </button>
        </main>
      )}

    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
